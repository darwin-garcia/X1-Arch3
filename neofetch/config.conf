print_info() {

    info title

    # prin "$(color 8)┌──────────────────────────────────────────┐"

    info "​​​$(color 1)  OS  " 	distro # OS Linux Distro
    info "​​$(color 1)  Host  " 	model # Host Model (Your PC)
    info "​​$(color 1)  Kernel " 	kernel # Linux Kernel
    info "​​$(color 1)  Uptime " 	uptime # Uptime (PC Stay on)
    info "​​$(color 2)  Packages " 	packages # Installed Packages 
    info "​​$(color 2)  Shell " 		shell # Terminal Shell
    info "​​$(color 2) 󰍹 Resolution " 	resolution # Display Resolution
    info "​​$(color 3)  DE "	 	de #Desktop Environment
    info "​​$(color 3) 󱫋 WM   " 		wm # Window Manager
    info "​​$(color 12) 󱫋 WM Theme "	wm_theme # Window Manager Theme
    info "$(color 13) 󰧨 Theme "	theme # Desktop Theme [GTK2/3]
    info "$(color 14) 󰀻 Icons "	icons # Icons
    info "​​$(color 3)  Terminal "	term # Terminal used
    info "   Font  " 	font # Font Type in WM/DE
    info "   Terminal Font"    term_font # Font Type in Terminal

    # prin "$(color 8)└──────────────────────────────────────────┘"
    # prin " "
    # info "​ ​​ ​​​ $(color 6) " title
    # prin " "
    # prin "$(color 8)┌──────────────────────────────────────────┐"

    info "​$(color 12)  CPU " 	cpu # CPU Name
    info "​​$(color 12)  GPU " gpu # GPU Name
    info "​​$(color 13)  GPU Driver " 	gpu_driver  # Linux/macOS only
    info "​​$(color 13)  Memory " 	memory # Total Memory and used
    info "󰋊 Disk" disk # Free space in /
    info " Battery" battery # Laptop Battery in Use

    # prin "$(color 8)└──────────────────────────────────────────┘"
    # prin " "
    prin "​ ​​ ​​ ​​$(color 1)​ ​​ ​​$(color 2)​ ​​ ​​$(color 3)​ ​​ ​​$(color 4)​ ​​ ​​$(color 5)​ ​​ ​​$(color 6)​ ​​ ​​$(color 7)​ ​​ ​​$(color 8)​ ​​ ​​$(color 16)"

}

#    ░█▀█░█▀█░▀█▀░▀█▀░█▀█░█▀█░█▀▀
#    ░█░█░█▀▀░░█░░░█░░█░█░█░█░▀▀█
#    ░▀▀▀░▀░░░░▀░░▀▀▀░▀▀▀░▀░▀░▀▀▀

# Title

title_fqdn="off"

# Kernel

kernel_shorthand="on"

# Distro

distro_shorthand="off"

# Show/Hide OS Architecture.

os_arch="on"

# Uptime

uptime_shorthand="on"

# Memory

memory_percent="on"
memory_unit="gib"

# Packages

package_managers="on"

# $SHELL

shell_path="off"
shell_version="on"

# CPU

# CPU speed type

speed_type="bios_limit"

# CPU speed shorthand

speed_shorthand="off"

# Enable/Disable CPU brand in output.

cpu_brand="on"

# CPU Speed

cpu_speed="on"

# CPU Cores

cpu_cores="logical"

# CPU Temperature

cpu_temp="off"


# GPU

gpu_brand="on"
gpu_type="all"


# Resolution

refresh_rate="on"


# Gtk Theme / Icons / Font

gtk_shorthand="off"

# Enable/Disable gtk2 Theme / Icons / Font

gtk2="on"

# Enable/Disable gtk3 Theme / Icons / Font

gtk3="on"

# IP Address

public_ip_host="http://ident.me"
public_ip_timeout=2

# Desktop Environment

de_version="on"

# Disk

disk_show=('/')
disk_subtitle="mount"
disk_percent="on"

# Song

music_player="auto"
song_format="%artist% - %album% - %title%"

# Print the Artist, Album and Title on separate lines

song_shorthand="off"

mpc_args=()

# Text Colors

colors=(distro)

# Text Options

# Toggle bold text
bold="on"

# Enable/Disable Underline

underline_enabled="on"

# Underline character

underline_char="-"

# Info Separator
separator=":"

# Color Blocks

block_range=(0 15)

# Toggle color blocks

color_blocks="on"

# Color block width in spaces

block_width=3

# Color block height in lines

block_height=1

# Color Alignment

col_offset="auto"

# Progress Bars


# Bar characters

bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15

bar_color_elapsed="distro"
bar_color_total="distro"

cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"

#    ░█▀▄░█▀█░█▀▀░█░█░█▀▀░█▀█░█▀▄░░░█▀▀░█▀▀░▀█▀░▀█▀░▀█▀░█▀█░█▀▀░█▀▀
#    ░█▀▄░█▀█░█░░░█▀▄░█▀▀░█░█░█░█░░░▀▀█░█▀▀░░█░░░█░░░█░░█░█░█░█░▀▀█
#    ░▀▀░░▀░▀░▀▀▀░▀░▀░▀▀▀░▀░▀░▀▀░░░░▀▀▀░▀▀▀░░▀░░░▀░░▀▀▀░▀░▀░▀▀▀░▀▀▀

image_backend="ascii"

# image_source= "auto"

ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"

# Image Options

image_loop="off"
image_size='auto'

# Thumbnail directory

thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="northwest"

gap=8
yoffset=0
xoffset=2

background_color=

# Misc Options

stdout="off"
